services:
  postgres:
    image: postgres:18
    container_name: prueba-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: norte70
      POSTGRES_USER: norte70_user
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norte70_user -d norte70"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: